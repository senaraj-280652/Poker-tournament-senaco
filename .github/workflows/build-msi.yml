name: Build Windows .msi

# Compile le Gestionnaire de Tournoi de Poker en un installateur Windows
# (.msi) sur un runner Windows fourni par GitHub — voir windows/README.md.
#
# Déclenchement :
#   - manuel (onglet Actions → "Build Windows .msi" → "Run workflow")
#   - automatique sur un tag "v*" (ex. v1.0.0), avec publication du .msi
#     dans une Release GitHub
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-msi:
    runs-on: windows-latest
    # Nécessaire pour l'étape "Publication dans la Release" ci-dessous
    # (softprops/action-gh-release crée une Release + y attache le .msi) :
    # sans ça, le GITHUB_TOKEN par défaut est en lecture seule et cette
    # étape échoue avec "403 / Resource not accessible by integration",
    # même si la génération du .msi elle-même a réussi.
    permissions:
      contents: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Lecture du numéro de version (source de référence : version.py)"
        # APP_VERSION dans version.py est la source unique de vérité du
        # numéro de version (voir sa docstring) — jamais windows/app.wxs,
        # qui ne fait que la reporter à la main. Nommer le .msi et
        # l'artifact d'après cette valeur (demande du 2026-10-20, suite à
        # deux incidents réels où un ancien .msi au nom générique
        # "PokerTournament-16.msi" a été confondu avec le dernier build)
        # rend une telle confusion immédiatement visible dans le nom du
        # fichier, sans toucher au mécanisme de mise à niveau lui-même
        # (Version dans app.wxs reste indépendamment la source lue par
        # WiX/Windows Installer). Extraction déportée dans windows/
        # read_version.py plutôt qu'un -c en ligne : ses guillemets
        # entraient en conflit avec le découpage de pwsh (vérifié).
        id: version
        shell: pwsh
        run: |
          $v = python windows/read_version.py
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt

      - name: Verrou anti-copie (injection du secret de licence)
        # Écrit _license_secret.py à partir du secret de dépôt LICENSE_SECRET
        # (Settings → Secrets and variables → Actions → New repository
        # secret) — jamais commité, voir license.py et .gitignore. Sans ce
        # secret configuré, cette étape ne fait rien et l'exécutable produit
        # ne demandera jamais d'activation. (Le test se fait dans le script
        # plutôt que via un "if:" sur secrets.*, qui provoquait un "Startup
        # failure" au démarrage du workflow.)
        env:
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        run: |
          if ($env:LICENSE_SECRET) {
            "SECRET = '$env:LICENSE_SECRET'" | Out-File -Encoding utf8 _license_secret.py
          }

      - name: Génération de PokerTournament.exe (PyInstaller)
        run: |
          pyinstaller windows/poker_tournament.spec --distpath windows/dist --workpath windows/build --noconfirm

      - name: Installation de l'outil WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2 --global

      - name: Génération de PokerTournament-${{ steps.version.outputs.version }}.msi (WiX)
        run: |
          wix build windows/app.wxs -arch x64 -ext WixToolset.UI.wixext -d Dist=windows/dist -out windows/dist/PokerTournament-${{ steps.version.outputs.version }}.msi

      - name: Publication de l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokerTournament-${{ steps.version.outputs.version }}
          path: windows/dist/PokerTournament-${{ steps.version.outputs.version }}.msi
          if-no-files-found: error

      - name: Publication dans la Release (si déclenché par un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/PokerTournament-${{ steps.version.outputs.version }}.msi
